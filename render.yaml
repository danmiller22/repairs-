services:
  - type: web
    name: us-team-fleet-free
    runtime: node
    plan: free
    region: ohio
    buildCommand: NODE_ENV=development npm ci && npx prisma generate && npx prisma migrate deploy && npm run build && cp -r public .next/standalone/public && mkdir -p .next/standalone/.next && cp -r .next/static .next/standalone/.next/static
    startCommand: node .next/standalone/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        value: https://us-team-fleet-free.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://us-team-fleet-free.onrender.com
      - key: TORQVOICE_MODE
        value: self-hosted
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.23.1
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
